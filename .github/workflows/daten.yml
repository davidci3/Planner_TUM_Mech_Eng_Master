# Aktualisiert die TUMonline-Daten (Termine, Prüfungen, Studienplan) automatisch und committet sie.
# GitHub Pages veröffentlicht danach den neuen Stand für alle Nutzer.
name: Daten aktualisieren

on:
  schedule:
    - cron: '17 3 * * *'   # täglich ca. 5:17 Uhr (MESZ)
  workflow_dispatch:        # manuell: Actions → „Daten aktualisieren“ → Run workflow
    inputs:
      katalog:
        description: 'Auch den Studienplan (Katalog) neu laden'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Studienplan: montags und bei manuellem Start (schont TUMonline)
      - name: Studienplan (Katalog) neu laden
        if: github.event_name == 'schedule' || inputs.katalog
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then echo "Nur montags."; exit 0; fi
          node tools/katalog.mjs data

      # Prüfungsstatistiken von examstats.de: montags und bei manuellem Start; ein Ausfall stoppt den Rest nicht
      - name: Prüfungsstatistiken (examstats.de)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then echo "Nur montags."; exit 0; fi
          node tools/examstats.mjs data

      - name: Termine und Prüfungen des aktuellen Semesters
        run: node tools/semester.mjs auto data

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Daten aus TUMonline aktualisiert ($(date -u +%Y-%m-%d))"
          git push
